<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Dom Education Center</title>
    <meta
      name="description"
      content="Matematika va ingliz tilini o'rganmoqchimisiz? Ro'yxatdan o'ting, mutaxassislarimiz siz bilan bog'lanadi."
    />
    <link rel="shortcut icon" href="img/icon.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="vendor/swiper/swiper-bundle.min.css" />

    <!-- Meta Pixel -->

      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);

        n.push = n;

    <noscript>
      <img
        height="1"
        width="1"

  </head>

  <body>
    <section class="hero">
      <div class="container">
        <div class="card">
          <div class="left">
            <div class="header-top">
              <img src="img/Logo-blue-orange.png" alt="English Dom logo" class="logo" />
              <div class="lang-mini">
                <button class="lang-btn active" data-lang="uz" type="button">UZ</button>
                <button class="lang-btn" data-lang="ru" type="button">RU</button>
              </div>
            </div>

            <h2 id="hero-title">
              Matematika va ingliz tili <span>o'rganishni</span> xohlaysizmi?
            </h2>
            <p class="text" id="hero-desc">
              Ismingiz va telefon raqamingizni yozib qoldiring, biz sizga
              qo'ng'iroq qilamiz va birorta ham savolingiz javobsiz
              qolmasligiga harakat qilamiz
            </p>

            <form class="form-container" id="lead-form" novalidate>
              <div class="subjects-container">
                <p class="label-text" id="label-subjects">Qaysi fanni o'qimoqchisiz?</p>
                <div class="checkbox-group">
                  <label class="checkbox-item">
                    <input type="checkbox" name="subject" value="Matematika" />
                    <span class="custom-check"></span>
                    <span id="label-math">Matematika</span>
                  </label>
                  <label class="checkbox-item">
                    <input type="checkbox" name="subject" value="Ingliz tili" />
                    <span class="custom-check"></span>
                    <span id="label-english">Ingliz tili</span>
                  </label>
                  <label class="checkbox-item">
                    <input type="checkbox" name="subject" value="Boshqa" />
                    <span class="custom-check"></span>
                    <span id="label-other">Boshqa</span>
                  </label>
                </div>
              </div>

              <input type="text" id="input-name" placeholder="Ismingiz" autocomplete="name" required />

              <div class="phone-field">
                <span class="phone-prefix">+998</span>
                <input
                  type="tel"
                  id="input-phone"
                  placeholder="90 123 45 67"
                  inputmode="numeric"
                  minlength="9"
                  maxlength="9"
                  autocomplete="tel-national"
                  required
                />
              </div>

              <button class="send-btn" id="btn-send" type="submit">Ro'yxatdan o'tish</button>
            </form>
          </div>

          <div class="right">
            <div class="swiper-card-box">
              <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                  <div class="swiper-slide">
                    <img
                      src="img/dtm.jpg"


                      alt="DTM natijalari"
                      fetchpriority="high"
                    />
                  </div>
                  <div class="swiper-slide">
                    <img
                      src="img/cefr.jpg"


                      alt="CEFR sertifikati"
                      loading="lazy"
                    />
                  </div>
                  <div class="swiper-slide">
                    <img
                      src="img/ml1.jpg"


                      alt="Milliy sertifikat"
                      loading="lazy"
                    />
                  </div>
                </div>
                <div class="swiper-pagination"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="vendor/swiper/swiper-bundle.min.js" defer></script>
    <script src="config.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
